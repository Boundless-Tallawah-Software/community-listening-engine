services:
  database:
    image: postgres:14-alpine
    container_name: community_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: my_db_pass
      POSTGRES_DB: communitydb
    volumes:
      # Use the local directory created earlier for persistence
      - ./data/vault:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  api-service:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: api_service
    environment:
      # Use the service name (database) for Docker networking resolution
      DATABASE_URL: postgresql://postgres:my_db_pass@database:5432/communitydb
    volumes:
      - ./data:/app/data
    depends_on:
      - database
    ports:
      - "8880:8880"
    restart: always

  worker-service:
    build:
      context: .
      dockerfile: core/Dockerfile
    container_name: worker_service
    environment:
      DATABASE_URL: postgresql://postgres:my_db_pass@database:5432/communitydb
    volumes:
      - ./data:/app/data
    depends_on:
      - database
    restart: always
    command:
      - python
      - '-c'
      - 'import time; time.sleep(86400)'

volumes:
  vault_data: