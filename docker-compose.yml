services:
  database:
    image: postgres:14-alpine
    container_name: community_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: my_db_pass
      POSTGRES_DB: communitydb
    volumes:
      # Use the local directory created earlier for persistence
      - ./data/vault:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  api-service:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: api_service
    environment:
      # Use the service name (database) for Docker networking resolution
      DATABASE_URL: postgresql://postgres:my_db_pass@database:5432/communitydb
    depends_on:
      - database
    ports:
      - "8000:8000"
    restart: always

  worker-service:
    build:
      context: ./core
      dockerfile: Dockerfile
    container_name: worker_service
    environment:
      DATABASE_URL: postgresql://postgres:my_db_pass@database:5432/communitydb
    depends_on:
      - database
    restart: always

# Define the named volumes section for clarity
volumes:
  vault_data:
