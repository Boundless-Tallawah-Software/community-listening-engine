# GitHub Actions Preview Workflow
# .github/workflows/preview.yml
# Builds and deploys a Cloudflare Pages preview for every pull request.
# For the production pipeline, see .github/workflows/ci.yml
name: Preview

on:
  pull_request:

env:
  CLOUDFLARE_PAGES_PROJECT_NAME: community-listening-engine

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    needs: lint
    if: github.event.pull_request.head.repo.full_name == github.repository
    outputs:
      d1_database_id: ${{ steps.resources.outputs.d1_database_id }}
      d1_staging_database_id: ${{ steps.staging_resources.outputs.d1_database_id }}
    env:
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_API_TOKEN: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - name: Install Wrangler
        run: npm i -g wrangler
      - name: Run tests
        run: npm test
      - name: Create Cloudflare resources
        id: resources
        run: ./scripts/create_cloudflare_resources.sh
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DEPLOY_TARGET: production
      - name: Create Pages preview database
        id: staging_resources
        run: ./scripts/create_cloudflare_resources.sh
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DEPLOY_TARGET: staging
          D1_ONLY: 'true'
      - name: Build Worker
        run: npm run build
      - name: Build Pages site
        run: npm run build:pages
      - name: Build Pages Functions
        env:
          CLOUDFLARE_D1_DATABASE_ID: ${{ steps.resources.outputs.d1_database_id || '00000000-0000-0000-0000-000000000000' }}
          CLOUDFLARE_D1_PREVIEW_DATABASE_ID: ${{ steps.staging_resources.outputs.d1_database_id || '00000000-0000-0000-0000-000000000000' }}
          CLOUDFLARE_INFORMATION_MESSAGE: ${{ vars.CLOUDFLARE_INFORMATION_MESSAGE }}
        run: |
          set -euo pipefail
          PAGES_PROJECT_DIR="$RUNNER_TEMP/pages-project"
          mkdir -p "$PAGES_PROJECT_DIR"
          cp -R dist functions "$PAGES_PROJECT_DIR/"
          node scripts/create_pages_config.mjs "$PAGES_PROJECT_DIR/wrangler.jsonc"
          wrangler pages functions build functions --cwd "$PAGES_PROJECT_DIR" --build-output-directory dist

  preview:
    runs-on: ubuntu-latest
    needs: test
    concurrency:
      group: pages-preview-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - name: Install Wrangler
        run: npm i -g wrangler
      - name: Prepare Pages preview config
        env:
          PAGES_PROJECT_DIR: ${{ runner.temp }}/pages-project
          CLOUDFLARE_D1_DATABASE_ID: ${{ needs.test.outputs.d1_database_id }}
          CLOUDFLARE_D1_PREVIEW_DATABASE_ID: ${{ needs.test.outputs.d1_staging_database_id }}
          CLOUDFLARE_INFORMATION_MESSAGE: ${{ vars.CLOUDFLARE_INFORMATION_MESSAGE }}
        run: |
          set -euo pipefail
          npm run build:pages
          mkdir -p "$PAGES_PROJECT_DIR"
          cp -R dist functions migrations "$PAGES_PROJECT_DIR/"
          node scripts/create_pages_config.mjs "$PAGES_PROJECT_DIR/wrangler.jsonc"
      - name: Migrate staging database
        run: bash ./scripts/migrate_d1.sh
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DEPLOY_TARGET: staging
          WRANGLER_CWD: ${{ runner.temp }}/pages-project
          WRANGLER_ENV: preview
      - name: Deploy Pages preview
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PAGES_PROJECT_DIR: ${{ runner.temp }}/pages-project
          CLOUDFLARE_D1_DATABASE_ID: ${{ needs.test.outputs.d1_database_id }}
          CLOUDFLARE_D1_PREVIEW_DATABASE_ID: ${{ needs.test.outputs.d1_staging_database_id }}
          CLOUDFLARE_INFORMATION_MESSAGE: ${{ vars.CLOUDFLARE_INFORMATION_MESSAGE }}
        run: |
          set -euo pipefail
          wrangler pages deploy "$PAGES_PROJECT_DIR/dist" \
            --cwd "$PAGES_PROJECT_DIR" \
            --project-name "$CLOUDFLARE_PAGES_PROJECT_NAME" \
            --branch "pr-${{ github.event.pull_request.number }}"
