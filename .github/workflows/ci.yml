# GitHub Actions CI Workflow
# .github/workflows/ci.yml
name: CI

on:
  push:
    branches: [main, develop, cloudflare-arch-implementation-1]
  pull_request:

env:
  CLOUDFLARE_PAGES_PROJECT_NAME: community-listening-engine

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    needs: lint
    outputs:
      d1_database_id: ${{ steps.resources.outputs.d1_database_id }}
      d1_staging_database_id: ${{ steps.staging_resources.outputs.d1_database_id }}
    env:
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_API_TOKEN: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - name: Install Wrangler
        run: npm i -g wrangler
      - name: Run tests
        run: npm test
      - name: Create Cloudflare resources
        id: resources
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: ./scripts/create_cloudflare_resources.sh
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DEPLOY_TARGET: production
      - name: Create Pages preview database
        id: staging_resources
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: ./scripts/create_cloudflare_resources.sh
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DEPLOY_TARGET: staging
          D1_ONLY: 'true'
      - name: Build Worker
        run: npm run build
      - name: Build Pages site
        run: npm run build:pages
      - name: Build Pages Functions
        env:
          CLOUDFLARE_D1_DATABASE_ID: ${{ steps.resources.outputs.d1_database_id || '00000000-0000-0000-0000-000000000000' }}
          CLOUDFLARE_D1_PREVIEW_DATABASE_ID: ${{ steps.staging_resources.outputs.d1_database_id || '00000000-0000-0000-0000-000000000000' }}
          CLOUDFLARE_INFORMATION_MESSAGE: ${{ vars.CLOUDFLARE_INFORMATION_MESSAGE }}
        run: |
          set -euo pipefail
          CONFIG_FILE=.wrangler.pages.generated.jsonc
          trap 'rm -f "$CONFIG_FILE"' EXIT
          npm run build:pages
          node scripts/create_pages_config.mjs "$CONFIG_FILE"
          wrangler pages functions build functions --config "$CONFIG_FILE" --build-output-directory dist

  preview:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    concurrency:
      group: pages-preview-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - name: Install Wrangler
        run: npm i -g wrangler
      - name: Prepare Pages preview config
        env:
          CLOUDFLARE_D1_DATABASE_ID: ${{ needs.test.outputs.d1_database_id }}
          CLOUDFLARE_D1_PREVIEW_DATABASE_ID: ${{ needs.test.outputs.d1_staging_database_id }}
          CLOUDFLARE_INFORMATION_MESSAGE: ${{ vars.CLOUDFLARE_INFORMATION_MESSAGE }}
        run: |
          npm run build:pages
          node scripts/create_pages_config.mjs .wrangler.pages.generated.jsonc
      - name: Migrate staging database
        run: bash ./scripts/migrate_d1.sh
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DEPLOY_TARGET: staging
          WRANGLER_CONFIG: .wrangler.pages.generated.jsonc
          WRANGLER_ENV: preview
      - name: Deploy Pages preview
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ needs.test.outputs.d1_database_id }}
          CLOUDFLARE_D1_PREVIEW_DATABASE_ID: ${{ needs.test.outputs.d1_staging_database_id }}
          CLOUDFLARE_INFORMATION_MESSAGE: ${{ vars.CLOUDFLARE_INFORMATION_MESSAGE }}
        run: |
          set -euo pipefail
          CONFIG_FILE=.wrangler.pages.generated.jsonc
          trap 'rm -f "$CONFIG_FILE"' EXIT
          wrangler pages deploy dist \
            --config "$CONFIG_FILE" \
            --project-name "$CLOUDFLARE_PAGES_PROJECT_NAME" \
            --branch "pr-${{ github.event.pull_request.number }}"

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    concurrency:
      group: community-listening-engine-production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - name: Install Wrangler
        run: npm i -g wrangler
      - name: Check and apply D1 migrations
        run: bash ./scripts/migrate_d1.sh
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DEPLOY_TARGET: production
      - name: Deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ needs.test.outputs.d1_database_id }}
          CLOUDFLARE_D1_PREVIEW_DATABASE_ID: ${{ needs.test.outputs.d1_staging_database_id }}
          CLOUDFLARE_INFORMATION_MESSAGE: ${{ vars.CLOUDFLARE_INFORMATION_MESSAGE }}
          DEPLOY_TARGET: production
        run: |
          if [ -z "$CLOUDFLARE_D1_DATABASE_ID" ]; then
            echo "The resource provisioning job did not return a D1 database ID."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_D1_PREVIEW_DATABASE_ID" ]; then
            echo "The resource provisioning job did not return a staging D1 database ID."
            exit 1
          fi
          chmod +x ./scripts/deploy.sh
          ./scripts/deploy.sh $DEPLOY_TARGET
          npm run deploy:pages
