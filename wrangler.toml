# Cloudflare Workers / AI configuration
name = "community-listening-engine"
main = "src/webhook-worker.ts"
#account_id = "${CLOUDFLARE_ACCOUNT_ID}"
compatibility_date = "2024-09-07"

# Default staging routes (will be overridden by CI for production)
[[routes]]
pattern = "stage-ask.boundless-tallawah.com"
custom_domain = true

[[d1_databases]]
binding = "DB"
database_name = "listen_engine_db"

[[r2_buckets]]
binding = "R2"
bucket_name = "listen-audio"

[[kv_namespaces]]
binding = "CACHE"

[[queues.producers]]
binding = "JOBS"
queue = "transcription"

[ai]
binding = "AI"

# [[triggers]]
[[queues.consumers]]
queue = "transcription"
max_batch_size = 50
max_batch_timeout = 12000
